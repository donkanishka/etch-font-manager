name: Build WOFF2 WASM

# The font converter runs google/woff2 in the browser. There is no Node
# toolchain in this project and no Emscripten anywhere near it, so the binary is
# built here and the artefacts are committed back to the repo. Run this by hand
# from the Actions tab when a pin below changes; it is deliberately not part of
# every push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/woff2/**'
      - '.github/workflows/build-wasm.yml'

permissions:
  contents: write

env:
  # Pinned so the committed binary is reproducible. Bump deliberately, and note
  # the change in assets/wasm/BUILD.txt (this workflow rewrites it).
  EMSDK_VERSION: 3.1.64
  WOFF2_REF: fb9c3379f2605b10f3e8f1d9636664ab5576775c
  BROTLI_REF: v1.1.0

jobs:
  build:
    name: Compile and commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Fetch upstream sources
        run: |
          git clone --quiet https://github.com/google/woff2.git build/woff2
          git -C build/woff2 checkout --quiet "$WOFF2_REF"
          git clone --quiet --branch "$BROTLI_REF" --depth 1 https://github.com/google/brotli.git build/brotli

      # Brotli is C and woff2 is C++, so they cannot share one emcc invocation:
      # -std=c++11 against a .c file is a hard error ("invalid argument
      # '-std=c++11' not allowed with 'C'"). Brotli is compiled to objects
      # first, then linked into the C++ build.
      - name: Compile Brotli
        run: |
          mkdir -p build/obj
          for source in build/brotli/c/common/*.c build/brotli/c/dec/*.c build/brotli/c/enc/*.c; do
            object="build/obj/$(echo "$source" | tr '/' '_' | sed 's/\.c$/.o/')"
            emcc -O3 -I build/brotli/c/include -c "$source" -o "$object"
          done
          ls build/obj | wc -l

      # Both halves of woff2 are compiled. The encoder is what the converter
      # uses; the decoder is there so the panel can read the fvar table of a
      # variable font that arrives already wrapped as WOFF2, which it otherwise
      # cannot see at all. Brotli's decoder was already being compiled, because
      # the encoder's shared dictionary code reaches into it.
      #
      # -DNDEBUG is load-bearing, not tidiness. woff2_dec.cc calls assert() and
      # the encoder sources do not, so adding the decoder gave the binary a
      # sixth import, __assert_fail, which the glue leaves undefined at -sASSERTIONS=0.
      # The module then refused to instantiate in a browser -- "function import
      # requires a callable" -- taking the converter down with it, while the Node
      # smoke test went on passing. With NDEBUG the asserts compile out and the
      # import goes away.
      #
      # -DFONT_COMPRESSION_BIN is what upstream's Makefile uses to turn on
      # progress logging to stdout. It is omitted here on purpose: in a Web
      # Worker that logging is pure noise.
      - name: Compile
        run: |
          mkdir -p assets/wasm
          emcc \
            -O3 \
            -std=c++11 \
            -DNDEBUG \
            -D__STDC_FORMAT_MACROS \
            -I build/woff2/include \
            -I build/woff2/src \
            -I build/brotli/c/include \
            src/woff2/api.cpp \
            build/woff2/src/font.cc \
            build/woff2/src/glyph.cc \
            build/woff2/src/normalize.cc \
            build/woff2/src/table_tags.cc \
            build/woff2/src/transform.cc \
            build/woff2/src/variable_length.cc \
            build/woff2/src/woff2_common.cc \
            build/woff2/src/woff2_dec.cc \
            build/woff2/src/woff2_enc.cc \
            build/woff2/src/woff2_out.cc \
            build/obj/*.o \
            -o assets/wasm/woff2.js \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=EFMWoff2 \
            -s ENVIRONMENT=worker,node \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=33554432 \
            -s FILESYSTEM=0 \
            -s INVOKE_RUN=0 \
            -s ASSERTIONS=0 \
            -s EXPORTED_FUNCTIONS='["_efm_ttf_to_woff2","_efm_woff2_to_sfnt","_efm_output","_efm_release","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["HEAPU8"]'

      # A build that produces a file but cannot convert a font is worse than a
      # build that fails, because it would be committed and shipped. Both
      # flavours of sfnt are exercised: TrueType outlines and CFF (.otf).
      #
      # The round trip is the decoder's test. A variable font is used for it on
      # purpose: the only reason the decoder is here is to reach an fvar table,
      # so the test asserts that fvar survives the trip rather than only that
      # some bytes came back.
      - name: Smoke test
        run: |
          curl -sSLo /tmp/test.ttf https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/TTF/SourceCodePro-Regular.ttf
          curl -sSLo /tmp/test.otf https://raw.githubusercontent.com/adobe-fonts/source-code-pro/release/OTF/SourceCodePro-Regular.otf
          curl -sSLo /tmp/variable.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf
          test -s /tmp/variable.ttf
          node --input-type=commonjs -e '
            const fs = require("fs");

            /* Every import the wasm declares must be a callable in the object the
               glue hands to instantiate. Node was happy to run a binary that a
               browser refused to link -- the decoder had added an __assert_fail
               import the glue leaves undefined at -sASSERTIONS=0 -- so the
               functional test below passed on a build that could not load in the
               place it actually runs. Checking the import object catches that
               wherever the test happens to be executed. */
            const realInstantiate = WebAssembly.instantiate;
            let checked = false;
            WebAssembly.instantiate = function (mod, imports) {
              for (const ns of Object.keys(imports || {})) {
                for (const key of Object.keys(imports[ns])) {
                  const value = imports[ns][key];
                  if (typeof value !== "function" && typeof value !== "object" && typeof value !== "number") {
                    throw new Error("import " + ns + "." + key + " is " + typeof value + ", a browser would refuse to link this");
                  }
                }
              }
              checked = true;
              return realInstantiate.apply(this, arguments);
            };

            const factory = require("./assets/wasm/woff2.js");

            function tables(buf) {
              const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
              const count = view.getUint16(4);
              const out = [];
              for (let i = 0; i < count; i++) {
                const at = 12 + i * 16;
                out.push(String.fromCharCode(buf[at], buf[at + 1], buf[at + 2], buf[at + 3]));
              }
              return out;
            }

            function call(m, fn, input) {
              const addr = m._malloc(input.length);
              m.HEAPU8.set(input, addr);
              const length = m[fn](addr, input.length);
              m._free(addr);
              if (!length) { m._efm_release(); return null; }
              const out = m.HEAPU8.slice(m._efm_output(), m._efm_output() + length);
              m._efm_release();
              return Buffer.from(out);
            }

            function run(m, fn, input) {
              const out = call(m, fn, input);
              if (!out) { throw new Error(fn + " returned 0"); }
              return out;
            }

            factory().then((m) => {
              for (const name of ["/tmp/test.ttf", "/tmp/test.otf"]) {
                const input = fs.readFileSync(name);
                const out = run(m, "_efm_ttf_to_woff2", input);
                const signature = out.slice(0, 4).toString("latin1");
                if (signature !== "wOF2") { throw new Error(name + ": bad signature " + signature); }
                if (out.length >= input.length) { throw new Error(name + ": output not smaller"); }
                console.log(name, input.length, "->", out.length, "bytes");
              }

              const variable = fs.readFileSync("/tmp/variable.ttf");
              const axesBefore = tables(variable).includes("fvar");
              if (!axesBefore) { throw new Error("test fixture is not a variable font"); }

              const packed = run(m, "_efm_ttf_to_woff2", variable);
              if (packed.slice(0, 4).toString("latin1") !== "wOF2") { throw new Error("round trip: not WOFF2"); }

              const unpacked = run(m, "_efm_woff2_to_sfnt", packed);
              const found = tables(unpacked);
              if (!found.includes("fvar")) { throw new Error("round trip: fvar did not survive, got " + found.join(" ")); }
              console.log("round trip", variable.length, "->", packed.length, "->", unpacked.length, "bytes, fvar present");

              if (call(m, "_efm_woff2_to_sfnt", Buffer.from("not a font at all")) !== null) {
                throw new Error("decoder accepted garbage");
              }
              if (!checked) { throw new Error("the import object was never inspected"); }
              console.log("smoke test OK, imports all callable");
            }).catch((error) => { console.error(error); process.exit(1); });
          '

      - name: Record provenance
        run: |
          {
            echo "Built by .github/workflows/build-wasm.yml"
            echo "Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Date:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "emsdk:    $EMSDK_VERSION"
            echo "woff2:    google/woff2 @ $WOFF2_REF"
            echo "brotli:   google/brotli @ $BROTLI_REF"
            echo
            echo "woff2.js   $(stat -c%s assets/wasm/woff2.js) bytes  sha256 $(sha256sum assets/wasm/woff2.js | cut -d' ' -f1)"
            echo "woff2.wasm $(stat -c%s assets/wasm/woff2.wasm) bytes  sha256 $(sha256sum assets/wasm/woff2.wasm | cut -d' ' -f1)"
            echo
            echo "google/woff2 and google/brotli are both MIT. Copies of their licences"
            echo "are in assets/wasm/LICENSE-woff2.txt and assets/wasm/LICENSE-brotli.txt."
          } > assets/wasm/BUILD.txt
          cp build/woff2/LICENSE assets/wasm/LICENSE-woff2.txt
          cp build/brotli/LICENSE assets/wasm/LICENSE-brotli.txt
          cat assets/wasm/BUILD.txt

      - name: Commit artefacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/wasm/woff2.js assets/wasm/woff2.wasm assets/wasm/BUILD.txt \
            assets/wasm/LICENSE-woff2.txt assets/wasm/LICENSE-brotli.txt
          if git diff --staged --quiet; then
            echo 'Binary unchanged, nothing to commit.'
            exit 0
          fi
          git commit -m 'Build WOFF2 converter (woff2 ${{ env.WOFF2_REF }}, brotli ${{ env.BROTLI_REF }})'
          git push
