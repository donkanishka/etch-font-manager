name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: cs2pr

      - name: Syntax check
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # No Composer, no PHPUnit and no WordPress test suite: the suite stubs the
      # handful of WordPress functions it reaches and runs anywhere PHP does.
      - name: Behavioural tests
        run: php tests/run.php

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install PHPCS and the WordPress standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs:^3 \
            phpcompatibility/phpcompatibility-wp
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      # Warnings are almost all whitespace alignment, which `phpcbf` applies
      # automatically, so they are reported without blocking a release.
      - name: Report warnings
        continue-on-error: true
        run: phpcs -q --report=summary

      # Errors are fatal. Suppressing warnings here keeps the exit code
      # meaningful rather than red on cosmetics.
      - name: Fail on errors
        run: phpcs -q --warning-severity=0 --report=full

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check panel script parses
        run: node --check assets/panel.js

      - name: Check the tooling parses
        run: |
          node --check tools/check-pot.js
          node --check tools/boot-check.js

      # --check only parses. v0.34.0 shipped a file that parsed perfectly and
      # threw on the first line of real work, which meant the Settings Bar
      # control never registered and the plugin had no icon at all. This runs it.
      - name: Check the panel boots
        run: node tools/boot-check.js

      - name: Check bounded WOFF reconstruction
        run: node tools/woff-check.js

      # Parsing and booting both pass on code that dies the moment it reaches a
      # branch nothing exercised. Two releases were broken that way: 0.34.0 read
      # a var before it was assigned, and 0.36.0 left a reference to a variable
      # it had just removed, which threw inside the Google Fonts section and
      # took three sections of the family editor with it. no-undef catches both.
      #
      # es2021 is in the env list for the globals, not the syntax: ecmaVersion
      # governs what parses, while Uint8Array and DataView -- which the WOFF and
      # sfnt readers are built on -- only exist as known globals once the es2021
      # environment is on. Without it the first run reported fifteen problems,
      # all of them those two names.
      - name: Check for undefined identifiers
        run: |
          npx --yes eslint@8 \
            --no-eslintrc \
            --parser-options=ecmaVersion:2021 \
            --env browser,worker,es2021 \
            --global EFMWoff2:readonly \
            --rule '{"no-undef":"error"}' \
            assets/panel.js assets/wasm/woff2-worker.js

      # The translation template drifted for two dozen releases because it was
      # kept by hand. This fails the build when a string is added, removed or
      # moved without rebuilding it.
      - name: Check the translation template is current
        run: node tools/check-pot.js

      - name: Check the update manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('update.json','utf8')); console.log('update.json OK')"

  multisite:
    name: Real WordPress multisite isolation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-only
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli
      - name: Create disposable network and test real site permissions
        env:
          EFM_DISPOSABLE_TEST: '1'
        run: |
          WP="$RUNNER_TEMP/efm-wordpress"
          mkdir -p "$WP"
          wp core download --version=7.0 --path="$WP"
          wp config create --dbname=wordpress --dbuser=root --dbpass=disposable-test-only --dbhost=127.0.0.1:3306 --path="$WP"
          wp core multisite-install --url=example.test --title=Isolation --admin_user=network-admin --admin_password=disposable-test-only --admin_email=network@example.test --skip-email --path="$WP"
          ln -s "$GITHUB_WORKSPACE" "$WP/wp-content/plugins/etch-font-manager"
          wp plugin activate etch-font-manager --network --path="$WP"
          set -o pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/multisite-live.php" --path="$WP" 2>&1 | tee "$RUNNER_TEMP/efm-multisite.log"
          if grep -Ei 'WordPress database error|PHP (Warning|Fatal error|Notice)' "$RUNNER_TEMP/efm-multisite.log"; then
            echo 'Runtime errors are release blockers, even when assertions pass.'
            exit 1
          fi
