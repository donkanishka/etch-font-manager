name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: cs2pr

      - name: Syntax check
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # No Composer, no PHPUnit and no WordPress test suite: the suite stubs the
      # handful of WordPress functions it reaches and runs anywhere PHP does.
      - name: Behavioural tests
        run: php tests/run.php

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install PHPCS and the WordPress standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs:^3 \
            phpcompatibility/phpcompatibility-wp
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      # Warnings are almost all whitespace alignment, which `phpcbf` applies
      # automatically, so they are reported without blocking a release.
      - name: Report warnings
        continue-on-error: true
        run: phpcs -q --report=summary

      # Errors are fatal. Suppressing warnings here keeps the exit code
      # meaningful rather than red on cosmetics.
      - name: Fail on errors
        run: phpcs -q --warning-severity=0 --report=full

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check panel script parses
        run: node --check assets/panel.js

      - name: Check the tooling parses
        run: node --check tools/check-pot.js

      # The translation template drifted for two dozen releases because it was
      # kept by hand. This fails the build when a string is added, removed or
      # moved without rebuilding it.
      - name: Check the translation template is current
        run: node tools/check-pot.js

      - name: Check the update manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('update.json','utf8')); console.log('update.json OK')"
